<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YMS Multi-Color Panel</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e; color: #e0e0e0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 12px;
  }
  .panel {
    background: #16213e; border-radius: 14px; padding: 16px;
    max-width: 960px; width: 100%;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  /* Header */
  .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid #2a2a4a; }
  .header h1 { font-size:15px; font-weight:600; color:#fff; }
  .badge { font-size:11px; padding:3px 10px; border-radius:10px; font-weight:500; }
  .badge-ready { background:#1b5e20; color:#81c784; }
  .badge-printing { background:#e65100; color:#ffcc80; }
  .badge-off { background:#424242; color:#bdbdbd; }
  .conn-dot { width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:4px; }
  .conn-ok { background:#4CAF50; } .conn-fail { background:#F44336; }

  /* SVG */
  .feeder-svg { width:100%; height:auto; }

  /* Slot card */
  .slot-card { fill:#222840; stroke:#3a3a5a; stroke-width:1; }
  .slot-card-active { fill:#1a3050; stroke:#5c9ce6; stroke-width:2; }
  .slot-clr { rx:2; }
  .slot-txt { fill:#fff; font-size:10px; font-weight:600; font-family:system-ui; text-anchor:middle; }
  .slot-sub { fill:#8899aa; font-size:8px; font-family:system-ui; text-anchor:middle; }

  /* Sensor */
  .ms-detected { fill:#4CAF50; } .ms-empty { fill:#444; } .ms-unknown { fill:#FF9800; } .ms-blocked { fill:#F44336; }
  .ms-lbl { fill:#ddd; font-size:6px; font-family:system-ui; text-anchor:middle; dominant-baseline:central; }

  /* Gear */
  .gear-on { fill:#4CAF50; } .gear-off { fill:#333; }
  .gear-ico { fill:#ccc; font-size:9px; text-anchor:middle; dominant-baseline:central; }

  /* Tube */
  .tube { fill:none; stroke-width:2.5; stroke-linecap:round; }
  .tube-idle { stroke:#222; }
  .tube-live { stroke-dasharray:8 4; }
  .flow { animation:fl .7s linear infinite; } @keyframes fl { to { stroke-dashoffset:-12; } }

  /* Filament position dot */
  .fp { stroke:#fff; stroke-width:1.5; }
  .fp-lbl { fill:#8899bb; font-size:6px; font-family:system-ui; text-anchor:middle; }

  /* Hotend */
  .hot-box { fill:#252540; stroke:#444; stroke-width:1.5; }
  .hot-lbl { fill:#aaa; font-size:10px; font-family:system-ui; text-anchor:middle; dominant-baseline:central; }
  .hot-sub { fill:#667; font-size:7px; font-family:system-ui; text-anchor:middle; }

  /* TS */
  .ts-on { fill:#4CAF50; stroke:#66BB6A; stroke-width:1.5; }
  .ts-off { fill:#444; stroke:#555; stroke-width:1.5; }
  .ts-lbl { fill:#fff; font-size:7px; font-family:system-ui; text-anchor:middle; dominant-baseline:central; }

  /* Cutter */
  .cut-on { fill:#E91E63; stroke:#C2185B; stroke-width:1.5; }
  .cut-off { fill:#333; stroke:#555; stroke-width:1; }
  .cut-ico { fill:#fff; font-size:11px; text-anchor:middle; dominant-baseline:central; pointer-events:none; }

  /* Nozzle */
  .noz { fill:#e53935; }
  .noz-t { fill:#ff8a80; font-size:11px; font-family:system-ui; text-anchor:middle; font-weight:700; }

  /* Pulse */
  .pulse { animation:pu 1.4s ease-in-out infinite; } @keyframes pu { 0%,100%{opacity:1;} 50%{opacity:.4;} }

  /* Controls */
  .controls { display:flex; gap:5px; flex-wrap:wrap; margin-top:12px; justify-content:center; }
  .btn {
    background:#252545; border:1px solid #3a3a5a; color:#ccc;
    padding:5px 12px; border-radius:6px; cursor:pointer;
    font-size:11px; font-family:system-ui; transition:all .15s;
  }
  .btn:hover { background:#303060; border-color:#5c9ce6; color:#fff; }
  .btn.active { background:#1a4a1a; border-color:#4CAF50; color:#81c784; }
  .btn-init {
    background:#1a3a6a; border-color:#3a7ae6; color:#8ac4ff;
    font-weight:700; font-size:12px; padding:6px 18px;
  }
  .btn-init:hover { background:#2a4a8a; }

  /* Info */
  .info {
    margin-top:10px; padding:6px 12px; background:#111828; border-radius:6px;
    font-size:10px; font-family:'Courier New',monospace; color:#556; text-align:center;
  }
  .info span { color:#64b5f6; }
  .info .sep { color:#333; margin:0 4px; }
</style>
</head>
<body>
<div class="panel">
  <div class="header">
    <h1><span class="conn-dot" id="dot"></span>YMS Multi-Color</h1>
    <div class="badge" id="badge">...</div>
  </div>
  <svg id="svg" class="feeder-svg" viewBox="0 0 800 300"></svg>
  <div class="controls" id="ctrls"></div>
  <div class="info" id="info">---</div>
</div>

<script>
const HOST = window.location.hostname || 'localhost';
const API = `http://${HOST}:7125`;
let D = null, eT = 0;

const NS = 'http://www.w3.org/2000/svg';
function el(t, a, txt) {
  const e = document.createElementNS(NS, t);
  if (a) for (const [k,v] of Object.entries(a)) e.setAttribute(k, v);
  if (txt !== undefined) e.textContent = txt;
  return e;
}

function msC(s, act) {
  if (s===2) return 'ms-blocked';
  if (s===1) return 'ms-detected'+(act?' pulse':'');
  if (s===0) return 'ms-empty';
  return 'ms-unknown';
}

function render() {
  const svg = document.getElementById('svg');
  svg.innerHTML = '';
  if (!D || !D.enabled) {
    svg.setAttribute('viewBox','0 0 800 60');
    svg.appendChild(el('text',{x:400,y:35,fill:'#555','font-size':'13','text-anchor':'middle','font-family':'system-ui'},'YMS not detected'));
    return;
  }

  const n = D.num_slots;
  const M = 10;

  // Slot card dimensions (side by side)
  const cardW = 60, cardH = 70, cardG = 6;
  const totalSlotsW = n * (cardW + cardG) - cardG;

  // Hotend below
  const hotW = Math.max(totalSlotsW * 0.6, 120), hotH = 36;
  const tubeZone = 80; // vertical space for tubes

  const svgW = Math.max(totalSlotsW + M*2, hotW + M*4);
  const slotsX = (svgW - totalSlotsW) / 2;
  const slotsY = M;
  const tubeTopY = slotsY + cardH;
  const hotX = (svgW - hotW) / 2;
  const hotY = tubeTopY + tubeZone;
  const centerX = svgW / 2;
  const tsY = hotY + hotH + 18;
  const nozY = tsY + 30;
  const svgH = nozY + 30;
  svg.setAttribute('viewBox', `0 0 ${svgW} ${svgH}`);

  // ── Slots (side by side) ──────────────────────────
  for (let i = 0; i < n; i++) {
    const x = slotsX + i * (cardW + cardG);
    const y = slotsY;
    const cx = x + cardW/2;
    const col = '#'+(D.slot_color[i]||'CCC');
    const act = D.slot === i;
    const st = D.slot_status[i];
    const name = D.slot_name[i]||`YMS-${i+1}`;
    const mat = D.slot_material[i]||'?';

    // Card bg
    svg.appendChild(el('rect',{x,y,width:cardW,height:cardH,rx:8,class:act?'slot-card-active':'slot-card'}));

    // Color bar top
    svg.appendChild(el('rect',{x:x+4,y:y+4,width:cardW-8,height:6,fill:col,rx:3}));

    // Name
    svg.appendChild(el('text',{x:cx,y:y+22,class:'slot-txt'},name));

    // Material
    svg.appendChild(el('text',{x:cx,y:y+33,class:'slot-sub'},mat));

    // Motion sensor
    svg.appendChild(el('circle',{cx:cx-12,cy:y+48,r:5,class:msC(st,act)}));
    svg.appendChild(el('text',{x:cx-12,y:y+48,class:'ms-lbl'},'MS'));

    // Gear
    svg.appendChild(el('rect',{x:cx+4,y:y+42,width:14,height:12,rx:3,class:act?'gear-on':'gear-off'}));
    svg.appendChild(el('text',{x:cx+11,y:y+48,class:'gear-ico'},'\u2699'));

    // Tool label
    const mi = D.tool_to_slot_map ? D.tool_to_slot_map.indexOf(i) : i;
    svg.appendChild(el('text',{
      x:cx, y:y+65, fill:act?'#5c9ce6':'#445',
      'font-size':'8','text-anchor':'middle','font-family':'system-ui','font-weight':'600'
    }, mi>=0?`T${mi}`:''));

    // ── Tube from slot bottom to hotend top ──
    const tubeX1 = cx;
    const tubeY1 = y + cardH;
    const entryX = hotX + 10 + (i/(n-1||1)) * (hotW-20);
    const entryY = hotY;
    const midY = tubeY1 + (entryY-tubeY1)*0.5;
    const path = `M${tubeX1},${tubeY1} C${tubeX1},${midY} ${entryX},${midY} ${entryX},${entryY}`;

    const tube = el('path',{d:path, class:'tube '+(act?'tube-live flow':'tube-idle')});
    if (act) tube.setAttribute('stroke',col);
    svg.appendChild(tube);

    // Entry dot
    svg.appendChild(el('circle',{cx:entryX,cy:entryY,r:2.5,fill:act?col:'#333'}));

    // ── Filament position indicator ──
    if (st === 1 || act) {
      let fp = 0;
      if (act && D.toolhead_filament_detected) fp = 1.0;
      else if (act && D.filament_path === 'bowden') fp = 0.85;
      else if (st === 1) fp = 0.15;

      if (fp > 0.01) {
        const fx = tubeX1 + (entryX-tubeX1)*fp;
        const fy = tubeY1 + (entryY-tubeY1)*fp;

        // Filled tube portion
        svg.appendChild(el('path',{
          d:path, fill:'none', stroke:col, 'stroke-width':'2.5',
          'stroke-linecap':'round', 'stroke-dasharray':`${fp*150} 999`, opacity:'0.4'
        }));

        // Tip dot
        svg.appendChild(el('circle',{cx:fx,cy:fy,r:4,fill:col,class:'fp'+(act?' pulse':'')}));

        // Label
        const labels = {0.15:'inserted',0.85:'standby',1.0:'loaded'};
        const lbl = labels[fp];
        if (lbl) {
          svg.appendChild(el('text',{x:fx,y:fy-7,class:'fp-lbl'},lbl));
        }
      }
    }
  }

  // ── Hotend ────────────────────────────────────────
  svg.appendChild(el('rect',{x:hotX,y:hotY,width:hotW,height:hotH,rx:8,class:'hot-box'}));
  svg.appendChild(el('text',{x:centerX,y:hotY+hotH/2,class:'hot-lbl'},'HOTEND'));
  svg.appendChild(el('text',{x:centerX,y:hotY+hotH-4,class:'hot-sub'},`${n}-input`));

  // Vertical pipe from hotend to nozzle area
  svg.appendChild(el('line',{
    x1:centerX, y1:hotY+hotH, x2:centerX, y2:tsY-10,
    stroke:D.toolhead_filament_detected?'#4CAF50':'#333','stroke-width':'3'
  }));

  // ── Toolhead sensor ───────────────────────────────
  svg.appendChild(el('circle',{cx:centerX-18,cy:tsY,r:8,class:D.toolhead_filament_detected?'ts-on':'ts-off'}));
  svg.appendChild(el('text',{x:centerX-18,y:tsY,class:'ts-lbl'},'TS'));

  // ── Cutter ────────────────────────────────────────
  if (D.cutter_available) {
    const cg = el('g',{style:'cursor:pointer'});
    cg.appendChild(el('rect',{x:centerX+6,y:tsY-11,width:22,height:22,rx:4,class:D.cutter_enabled?'cut-on':'cut-off'}));
    cg.appendChild(el('text',{x:centerX+17,y:tsY,class:'cut-ico'},'\u2702'));
    cg.onclick = toggleCutter;
    svg.appendChild(cg);
  }

  // Pipe to nozzle
  svg.appendChild(el('line',{
    x1:centerX,y1:tsY+10,x2:centerX,y2:nozY-10,
    stroke:D.toolhead_filament_detected?'#e53935':'#333','stroke-width':'3'
  }));

  // ── Nozzle ────────────────────────────────────────
  svg.appendChild(el('polygon',{
    points:`${centerX-7},${nozY-8} ${centerX+7},${nozY-8} ${centerX+3},${nozY+8} ${centerX-3},${nozY+8}`,
    class:'noz'
  }));
  svg.appendChild(el('text',{x:centerX,y:nozY+22,class:'noz-t'},`${eT}\u00B0C`));
}

// ── Controls ────────────────────────────────────────────────────────────
function renderCtrls() {
  const box = document.getElementById('ctrls');
  box.innerHTML = '';
  if (!D || !D.enabled) return;

  // INIT button (prominent)
  const init = mk('\u26A1 INIT YMS', () => gc('YMS_INIT'));
  init.classList.add('btn-init');
  box.appendChild(init);

  // T buttons
  const detect = mk('T0 Detect', () => gc('T0'));
  box.appendChild(detect);
  for (let i = 0; i < D.num_slots; i++) {
    const b = mk(`T${i+1} ${D.slot_name[i]}`, () => gc(`T${i+1}`));
    if (D.slot === i) b.classList.add('active');
    box.appendChild(b);
  }

  // Separator
  box.appendChild(Object.assign(document.createElement('div'),{style:'width:100%'}));

  // Utilities
  box.appendChild(mk('TOFF', () => gc('TOFF')));
  box.appendChild(mk('Check', () => gc('YMS_CHECK_SLOTS')));
  if (D.cutter_available) {
    const cb = mk(D.cutter_enabled?'Cutter ON':'Cutter OFF', toggleCutter);
    if (D.cutter_enabled) cb.classList.add('active');
    box.appendChild(cb);
  }
}

function mk(l, fn) {
  const b = document.createElement('button');
  b.className='btn'; b.textContent=l; b.onclick=fn;
  return b;
}

// ── UI update ───────────────────────────────────────────────────────────
function updateUI() {
  const badge=document.getElementById('badge'), dot=document.getElementById('dot'), info=document.getElementById('info');
  if (!D) { badge.textContent='Offline'; badge.className='badge badge-off'; dot.className='conn-dot conn-fail'; info.innerHTML='---'; return; }
  dot.className='conn-dot conn-ok';
  if (D.print_state==='printing') { badge.textContent='Printing'; badge.className='badge badge-printing'; }
  else if (D.enabled) { badge.textContent=`Ready \u2022 ${D.num_slots} slots`; badge.className='badge badge-ready'; }
  else { badge.textContent='No YMS'; badge.className='badge badge-off'; }

  const as = D.slot>=0 ? D.slot_name[D.slot] : 'none';
  info.innerHTML = `Active: <span>${as}</span><span class="sep">|</span>Filament: <span>${D.filament}</span> (${D.filament_path})<span class="sep">|</span>Mapping: <span>${D.mapping||'---'}</span>`;
}

// ── API ─────────────────────────────────────────────────────────────────
async function poll() {
  try {
    const r = await fetch(`${API}/printer/objects/query?yms_manager&extruder`);
    const j = await r.json();
    D = j.result.status.yms_manager || null;
    eT = Math.round(j.result.status.extruder?.temperature || 0);
  } catch(e) { D=null; }
  render(); renderCtrls(); updateUI();
}

async function gc(cmd) {
  try { await fetch(`${API}/printer/gcode/script`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({script:cmd})}); } catch(e) {}
  setTimeout(poll,500);
}

async function toggleCutter() { if(D) await gc(`YMS_CUTTER ENABLE=${D.cutter_enabled?0:1}`); }

poll(); setInterval(poll, 1000);
</script>
</body>
</html>
