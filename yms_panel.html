<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YMS Multi-Color Panel</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    color: #e0e0e0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .panel {
    background: #16213e;
    border-radius: 16px;
    padding: 24px;
    max-width: 900px;
    width: 100%;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid #2a2a4a;
  }

  .header h1 {
    font-size: 18px;
    font-weight: 600;
    color: #fff;
  }

  .header .status {
    font-size: 13px;
    padding: 4px 12px;
    border-radius: 12px;
    font-weight: 500;
  }

  .status-ready { background: #1b5e20; color: #81c784; }
  .status-printing { background: #e65100; color: #ffcc80; }
  .status-error { background: #b71c1c; color: #ef9a9a; }
  .status-offline { background: #424242; color: #bdbdbd; }

  .feeder-svg {
    width: 100%;
    height: auto;
  }

  /* SVG slot styling */
  .slot-bg { fill: #2a2a4a; stroke: #3a3a5a; stroke-width: 1; rx: 6; }
  .slot-bg.active { stroke: #fff; stroke-width: 2; }

  .slot-color { rx: 4; }
  .slot-label { fill: #fff; font-size: 11px; font-weight: 600; font-family: system-ui; }
  .slot-material { fill: #aaa; font-size: 9px; font-family: system-ui; }
  .slot-temp { fill: #888; font-size: 9px; font-family: system-ui; }

  /* Motion sensor */
  .sensor-circle { stroke-width: 2; }
  .sensor-detected { fill: #4CAF50; stroke: #66BB6A; }
  .sensor-empty { fill: #555; stroke: #666; }
  .sensor-unknown { fill: #FF9800; stroke: #FFA726; }
  .sensor-blocked { fill: #F44336; stroke: #EF5350; }

  .sensor-label { fill: #ccc; font-size: 7px; font-family: system-ui; text-anchor: middle; }

  /* Gear stepper */
  .gear-rect { rx: 3; }
  .gear-active { fill: #4CAF50; }
  .gear-inactive { fill: #444; }
  .gear-icon { fill: #fff; font-size: 12px; text-anchor: middle; }

  /* PTFE tube */
  .tube { fill: none; stroke-width: 3; stroke-linecap: round; }
  .tube-inactive { stroke: #333; }
  .tube-active { stroke-dasharray: 10 5; }

  /* Flowing animation */
  .flowing {
    animation: filament-flow 0.8s linear infinite;
  }
  @keyframes filament-flow {
    to { stroke-dashoffset: -15; }
  }

  /* Sensor pulse */
  .pulse {
    animation: sensor-pulse 1.5s ease-in-out infinite;
  }
  @keyframes sensor-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  /* Hotend */
  .hotend-body { fill: #333; stroke: #555; stroke-width: 1.5; }
  .hotend-label { fill: #ccc; font-size: 10px; font-family: system-ui; text-anchor: middle; }
  .hotend-entry { stroke: #555; stroke-width: 1; }
  .hotend-entry-active { stroke-width: 2; }

  /* Nozzle */
  .nozzle { fill: #e53935; }
  .nozzle-temp { fill: #ff8a80; font-size: 11px; font-family: system-ui; text-anchor: middle; font-weight: 600; }

  /* Toolhead sensor */
  .ts-circle { stroke-width: 2; }
  .ts-detected { fill: #4CAF50; stroke: #66BB6A; }
  .ts-empty { fill: #555; stroke: #666; }
  .ts-label { fill: #fff; font-size: 7px; font-family: system-ui; text-anchor: middle; }

  /* Cutter */
  .cutter-rect { rx: 3; cursor: pointer; }
  .cutter-on { fill: #E91E63; stroke: #C2185B; stroke-width: 1.5; }
  .cutter-off { fill: #444; stroke: #555; stroke-width: 1; }
  .cutter-icon { fill: #fff; font-size: 11px; text-anchor: middle; pointer-events: none; }
  .cutter-unavailable { display: none; }

  /* Mapping bar */
  .mapping-bar {
    margin-top: 16px;
    padding: 12px;
    background: #1a1a2e;
    border-radius: 8px;
    font-size: 12px;
    font-family: 'Courier New', monospace;
    color: #888;
    text-align: center;
  }
  .mapping-bar span { color: #64b5f6; }

  /* Connection indicator */
  .conn-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 6px;
  }
  .conn-ok { background: #4CAF50; }
  .conn-fail { background: #F44336; }
</style>
</head>
<body>

<div class="panel" id="panel">
  <div class="header">
    <h1><span class="conn-dot" id="connDot"></span>YMS Multi-Color System</h1>
    <div class="status" id="statusBadge">Connecting...</div>
  </div>

  <svg id="feederSvg" class="feeder-svg" viewBox="0 0 760 50" preserveAspectRatio="xMidYMid meet">
    <!-- Dynamically populated -->
  </svg>

  <div class="mapping-bar" id="mappingBar">Mapping: ---</div>
</div>

<script>
// ── Configuration ──────────────────────────────────────────────────────
const MOONRAKER_URL = window.location.hostname || 'localhost';
const MOONRAKER_PORT = 7125;
const POLL_INTERVAL = 1000;

// ── Layout constants ───────────────────────────────────────────────────
const SLOT_W = 70, SLOT_H = 32, SLOT_GAP = 6;
const SENSOR_R = 7;
const GEAR_W = 20, GEAR_H = 18;
const HOTEND_W = 50, HOTEND_H = 0; // Height computed dynamically
const NOZZLE_W = 16, NOZZLE_H = 20;
const TUBE_START_X = 0; // Computed per slot
const HOTEND_X = 0; // Computed
const MARGIN = 20;

// ── State ──────────────────────────────────────────────────────────────
let ymsData = null;
let extruderTemp = 0;

// ── SVG helpers ────────────────────────────────────────────────────────
function svgEl(tag, attrs, text) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v);
  if (text !== undefined) el.textContent = text;
  return el;
}

function sensorClass(status, active) {
  if (status === 2) return 'sensor-blocked';
  if (status === 1) return 'sensor-detected' + (active ? ' pulse' : '');
  if (status === 0) return 'sensor-empty';
  return 'sensor-unknown';
}

// ── Render ─────────────────────────────────────────────────────────────
function render(data) {
  const svg = document.getElementById('feederSvg');
  svg.innerHTML = '';

  if (!data || !data.enabled) {
    svg.setAttribute('viewBox', '0 0 760 60');
    svg.appendChild(svgEl('text', {x: 380, y: 35, fill: '#666', 'font-size': '14',
      'text-anchor': 'middle', 'font-family': 'system-ui'}, 'YMS not detected'));
    return;
  }

  const n = data.num_slots;
  const slotTotalH = n * (SLOT_H + SLOT_GAP) - SLOT_GAP;

  // Layout
  const slotStartX = MARGIN;
  const sensorX = slotStartX + SLOT_W + 12;
  const gearX = sensorX + SENSOR_R * 2 + 10;
  const tubeStartX = gearX + GEAR_W + 5;
  const hotendX = tubeStartX + 200;
  const hotendH = slotTotalH + 20;
  const hotendY = MARGIN - 10;
  const tsX = hotendX + 40;
  const cutterX = tsX + 25;
  const nozzleX = cutterX + (data.cutter_available ? 30 : 10);
  const svgW = nozzleX + NOZZLE_W + MARGIN;
  const svgH = slotTotalH + MARGIN * 2;

  svg.setAttribute('viewBox', `0 0 ${svgW} ${svgH}`);

  // Draw each slot
  for (let i = 0; i < n; i++) {
    const y = MARGIN + i * (SLOT_H + SLOT_GAP);
    const cy = y + SLOT_H / 2;
    const color = '#' + (data.slot_color[i] || 'CCCCCC');
    const active = data.slot === i;
    const status = data.slot_status[i];
    const name = data.slot_name[i] || `YMS-${i+1}`;
    const mat = data.slot_material[i] || '?';
    const temp = data.slot_temperature[i] || 210;

    // Slot background
    const bg = svgEl('rect', {
      x: slotStartX, y: y, width: SLOT_W, height: SLOT_H,
      class: 'slot-bg' + (active ? ' active' : '')
    });
    svg.appendChild(bg);

    // Color indicator
    svg.appendChild(svgEl('rect', {
      x: slotStartX + 3, y: y + 3, width: 8, height: SLOT_H - 6,
      fill: color, class: 'slot-color'
    }));

    // Slot name
    svg.appendChild(svgEl('text', {
      x: slotStartX + 16, y: cy - 2, class: 'slot-label'
    }, name));

    // Material + temp
    svg.appendChild(svgEl('text', {
      x: slotStartX + 16, y: cy + 10, class: 'slot-material'
    }, `${mat} ${temp}°`));

    // Motion sensor circle
    svg.appendChild(svgEl('circle', {
      cx: sensorX + SENSOR_R, cy: cy, r: SENSOR_R,
      class: 'sensor-circle ' + sensorClass(status, active)
    }));
    svg.appendChild(svgEl('text', {
      x: sensorX + SENSOR_R, y: cy + 3, class: 'sensor-label'
    }, 'MS'));

    // Gear stepper
    svg.appendChild(svgEl('rect', {
      x: gearX, y: cy - GEAR_H / 2, width: GEAR_W, height: GEAR_H,
      class: 'gear-rect ' + (active ? 'gear-active' : 'gear-inactive')
    }));
    svg.appendChild(svgEl('text', {
      x: gearX + GEAR_W / 2, y: cy + 4, class: 'gear-icon'
    }, '\u2699'));

    // PTFE tube — line from gear to hotend entry
    const entryY = hotendY + 10 + (i / (n - 1 || 1)) * (hotendH - 20);
    const tubeColor = active ? color : undefined;
    const tube = svgEl('line', {
      x1: tubeStartX, y1: cy,
      x2: hotendX, y2: entryY,
      class: 'tube ' + (active ? 'tube-active flowing' : 'tube-inactive'),
    });
    if (tubeColor) tube.setAttribute('stroke', tubeColor);
    svg.appendChild(tube);

    // Hotend entry dot
    svg.appendChild(svgEl('circle', {
      cx: hotendX, cy: entryY, r: 3,
      fill: active ? color : '#444',
      class: 'hotend-entry' + (active ? ' hotend-entry-active' : '')
    }));
  }

  // Hotend body
  svg.appendChild(svgEl('rect', {
    x: hotendX - 5, y: hotendY, width: HOTEND_W, height: hotendH,
    rx: 8, class: 'hotend-body'
  }));
  svg.appendChild(svgEl('text', {
    x: hotendX + HOTEND_W / 2 - 5, y: hotendY + hotendH / 2 - 5, class: 'hotend-label'
  }, 'HOTEND'));
  svg.appendChild(svgEl('text', {
    x: hotendX + HOTEND_W / 2 - 5, y: hotendY + hotendH / 2 + 8, class: 'hotend-label',
    'font-size': '8'
  }, `${n}-in`));

  // Toolhead sensor
  const tsCy = hotendY + hotendH / 2;
  svg.appendChild(svgEl('circle', {
    cx: tsX, cy: tsCy, r: 9,
    class: 'ts-circle ' + (data.toolhead_filament_detected ? 'ts-detected' : 'ts-empty')
  }));
  svg.appendChild(svgEl('text', {
    x: tsX, y: tsCy + 3, class: 'ts-label'
  }, 'TS'));

  // Cutter
  if (data.cutter_available) {
    const cutG = svgEl('g', {transform: `translate(${cutterX}, ${tsCy})`, style: 'cursor:pointer'});
    cutG.appendChild(svgEl('rect', {
      x: -10, y: -12, width: 20, height: 24,
      class: 'cutter-rect ' + (data.cutter_enabled ? 'cutter-on' : 'cutter-off')
    }));
    cutG.appendChild(svgEl('text', {
      x: 0, y: 5, class: 'cutter-icon'
    }, '\u2702'));
    cutG.onclick = toggleCutter;
    svg.appendChild(cutG);
  }

  // Nozzle
  const nzX = nozzleX;
  const nzY = tsCy;
  const nozzle = svgEl('polygon', {
    points: `${nzX - 6},${nzY - 10} ${nzX + 6},${nzY - 10} ${nzX + 3},${nzY + 10} ${nzX - 3},${nzY + 10}`,
    class: 'nozzle'
  });
  svg.appendChild(nozzle);
  svg.appendChild(svgEl('text', {
    x: nzX, y: nzY + 25, class: 'nozzle-temp'
  }, `${extruderTemp}°C`));

  // Line from TS to nozzle
  svg.appendChild(svgEl('line', {
    x1: tsX + 9, y1: tsCy, x2: nzX - 8, y2: nzY,
    stroke: data.toolhead_filament_detected ? '#4CAF50' : '#444',
    'stroke-width': 3
  }));
}

// ── Status badge ───────────────────────────────────────────────────────
function updateBadge(data) {
  const badge = document.getElementById('statusBadge');
  const dot = document.getElementById('connDot');

  if (!data) {
    badge.textContent = 'Offline';
    badge.className = 'status status-offline';
    dot.className = 'conn-dot conn-fail';
    return;
  }

  dot.className = 'conn-dot conn-ok';

  if (data.print_state === 'printing') {
    badge.textContent = 'Printing';
    badge.className = 'status status-printing';
  } else if (data.enabled) {
    badge.textContent = `Ready \u2022 ${data.num_slots} slots`;
    badge.className = 'status status-ready';
  } else {
    badge.textContent = 'No YMS';
    badge.className = 'status status-offline';
  }

  // Mapping bar
  document.getElementById('mappingBar').innerHTML =
    'Mapping: <span>' + (data.mapping || '---') + '</span>' +
    ' \u2022 Filament: <span>' + data.filament + '</span>' +
    ' (' + data.filament_path + ')';
}

// ── API ────────────────────────────────────────────────────────────────
async function fetchData() {
  try {
    const url = `http://${MOONRAKER_URL}:${MOONRAKER_PORT}/printer/objects/query?yms_manager&extruder`;
    const resp = await fetch(url);
    const json = await resp.json();
    const status = json.result.status;

    ymsData = status.yms_manager || null;
    extruderTemp = Math.round(status.extruder?.temperature || 0);

    render(ymsData);
    updateBadge(ymsData);
  } catch (e) {
    ymsData = null;
    render(null);
    updateBadge(null);
  }
}

async function toggleCutter() {
  if (!ymsData) return;
  const enable = ymsData.cutter_enabled ? 0 : 1;
  try {
    await fetch(`http://${MOONRAKER_URL}:${MOONRAKER_PORT}/printer/gcode/script`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({script: `YMS_CUTTER ENABLE=${enable}`})
    });
  } catch (e) {}
}

// ── Init ───────────────────────────────────────────────────────────────
fetchData();
setInterval(fetchData, POLL_INTERVAL);
</script>
</body>
</html>
